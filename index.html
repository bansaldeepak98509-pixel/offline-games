<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline Games</title>
<style>
:root{--bg:#14182b;--panel:#1e2440;--cell:#2a3156;--text:#eef0ff;--muted:#9aa3d6;--accent:#35e0c0;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{height:100%;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center}
h1{margin:12px 0 18px;font-size:1.7rem;letter-spacing:-.02em}
#list{padding-bottom:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(92vw,420px)}
.card{background:var(--panel);color:var(--text);border:0;border-radius:16px;padding:22px 8px;font-size:1rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.card span{font-size:2.2rem}
#menu{display:flex;flex-direction:column;align-items:center;width:100%;flex:1;min-height:0;overflow-y:auto}
#menu[hidden],#stage[hidden]{display:none}
#stage{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;touch-action:none;user-select:none;flex:1}
.top{width:min(92vw,420px);display:flex;align-items:center;gap:10px}
.top h2{margin:0;font-size:1.2rem;flex:1}
#info{color:var(--muted);font-size:.9rem;text-align:center;min-height:1.2em}
#area{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.grid{display:grid;gap:8px;width:min(92vw,400px);aspect-ratio:1;background:var(--panel);padding:8px;border-radius:14px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr);gap:10px}
.c{background:var(--cell);color:var(--text);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(1.3rem,7vw,2rem);cursor:pointer}
.g3 .c{font-size:clamp(2rem,14vw,3.4rem)}
.c.on{background:#3d4a8a}.c.hit{background:#1f6f5f}
canvas{width:min(92vw,400px);aspect-ratio:1;border-radius:14px;background:var(--panel)}
.row{display:flex;gap:10px}
button{background:var(--accent);color:#06241e;border:0;border-radius:10px;padding:10px 18px;font-weight:700;font-size:1rem;cursor:pointer;font-family:inherit}
button.alt,#back{background:var(--panel);color:var(--text)}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<div id="app">
 <div id="menu">
  <h1>Offline Games</h1><div id="list"></div>
 </div>
 <div id="stage" hidden>
  <div class="top"><button id="back">Back</button><h2 id="gt"></h2></div>
  <div id="info"></div>
  <div id="area"></div>
 </div>
</div>
<script src="games2.js"></script>
<script src="games3.js"></script>
<script src="app.js"></script>
</body>
</html>
